<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams & Squads - CITPL 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=20261010">
</head>

<body class="citpl-app">
    <!-- Top Bar -->
    <div class="top-bar d-none d-lg-block">
        <div class="container-fluid d-flex justify-content-between align-items-center px-4">
            <div class="d-flex align-items-center gap-2">
                <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='../index.html'" class="btn btn-sm btn-outline-light rounded-pill px-3 fw-bold me-2">
                    <i class="fas fa-arrow-left me-1"></i> Back
                </button>
                <span><i class="fas fa-phone"></i> 9414200619 &nbsp;&nbsp; <i class="fas fa-envelope"></i> citpl@cit.ac.in</span>
            </div>
            <div><a href="../index.html">Home</a></div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm py-2 sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="../index.html">
                <img src="../assets/citpl-logo.png" alt="CITPL Logo" class="cit-logo">
                <div>
                    <div class="institute-title">सीआईटी प्रीमियर लीग 2026</div>
                    <div class="institute-subtitle">Franchise Teams & Squad Directory</div>
                </div>
            </a>
            <div class="ms-auto">
                <a href="captain.html" class="btn btn-warning btn-sm rounded-pill fw-bold text-dark"><i class="fas fa-crown me-1"></i> Captain Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="bg-dark text-white py-4">
        <div class="container px-4 text-center">
            <h2 class="fw-bold mb-1 text-warning"><i class="fas fa-shield-alt me-2"></i> CITPL Franchise Teams</h2>
            <p class="mb-0 text-muted">4 Teams • ₹10,000 Purse Each • Max 15 Squad Limit</p>
        </div>
    </div>

    <!-- Teams List -->
    <div class="container py-5">
        <div class="row g-4" id="teamsContainer">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <script src="../js/firebase-config.js"></script>
    <script src="../js/app-shell.js"></script>
    <script>
        function renderTeams() {
            const teams = window.citplDB.db.teams || [];
            const players = window.citplDB.db.players || [];
            const container = document.getElementById("teamsContainer");

            if (teams.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <div class="card shadow-sm border-0 rounded-4 p-5 bg-white">
                            <i class="fas fa-shield-alt text-muted fs-1 mb-3"></i>
                            <h4 class="fw-bold text-dark">No Teams Created Yet</h4>
                            <p class="text-muted">Franchise teams will be created and managed by the League Administrator.</p>
                            <div class="mt-2">
                                <a href="login.html" class="btn btn-warning rounded-pill px-4 fw-bold text-dark"><i class="fas fa-user-shield me-2"></i> Admin Login</a>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = teams.map(t => {
                const teamPlayers = players.filter(p => p.teamId === t.id);
                return `
                    <div class="col-lg-6">
                        <div class="card shadow-sm border-0 rounded-4 overflow-hidden h-100">
                            <div class="card-header bg-primary text-white p-4 d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center fw-bold fs-4 shadow" style="width: 50px; height: 50px;">${t.shortName}</div>
                                    <div>
                                        <h4 class="fw-bold mb-0">${t.name}</h4>
                                        <small class="text-light">Owner: ${t.ownerName || 'Admin Assigned'}</small>
                                    </div>
                                </div>
                                <div class="text-end">
                                    <span class="badge bg-warning text-dark fs-6 px-3 py-2 rounded-pill">Purse: ₹${t.remainingPurse}</span>
                                </div>
                            </div>
                            <div class="card-body p-4">
                                <h6 class="fw-bold text-dark mb-3"><i class="fas fa-users me-2 text-primary"></i> Team Squad (${teamPlayers.length}/15 Players)</h6>
                                <div class="row g-2">
                                    ${teamPlayers.length === 0 ? '<div class="col-12 text-muted small p-2">No players bought yet in auction.</div>' : teamPlayers.map(p => `
                                        <div class="col-md-6">
                                            <div class="p-2 rounded bg-light border d-flex align-items-center gap-2">
                                                <img src="${p.photo || 'https://via.placeholder.com/150'}" alt="${p.name}" class="rounded-circle" style="width: 35px; height: 35px; object-fit: cover;">
                                                <div class="overflow-hidden">
                                                    <strong class="d-block text-truncate small">${p.name}</strong>
                                                    <small class="text-muted" style="font-size: 11px;">${p.role} • ₹${p.auctionPrice}</small>
                                                </div>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderTeams();
    </script>
</body>

</html>
